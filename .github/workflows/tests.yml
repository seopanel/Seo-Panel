name: PHP backend tests

# Runs the spTests backend integration suite (tests/php/*_test.php)
# against a fresh install of this checkout - the same suite that's been
# run by hand via spTests/bin/run-php-tests-against-sp.sh for the whole
# life of this project so far. Neither this repo nor spTests had any CI
# at all before this workflow: every verification depended on someone
# remembering to run the suite manually, so a regression could sit
# unnoticed indefinitely.
#
# The seed sequence matters: a fresh install only ever runs
# install/data/seopanel.sql + install/data/textlang.sql (both already
# carry the full current schema). install/data/upgrade.sql is NOT part
# of a fresh install - it's the incremental migration path for installs
# that predate the current schema, and several of its ALTER/ADD COLUMN
# statements now conflict with columns seopanel.sql already creates
# directly (confirmed: importing it after seopanel.sql on a from-scratch
# DB fails with "Duplicate column name"). Verified this exact sequence
# end to end (fresh DB -> seopanel.sql -> textlang.sql -> app boots ->
# spTests passes) before writing this workflow.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  installUpgradeHttpTests:
    runs-on: ubuntu-latest

    # Drives install/index.php and install/upgrade.php over real HTTP,
    # the same way a real browser does - unlike the spTests job below,
    # which seeds the database directly and never touches install/ at
    # all. That gap is exactly why a whole chain of real install/upgrade
    # bugs (an unbounded telemetry DNS lookup, a blank-UI gap, a stale
    # service worker intercepting the install request, gzip compression
    # breaking the live progress bar, a progress callback that flooded
    # the page with 1400+ inline <script> blocks, and a login lockout
    # for every admin upgrading from a pre-7.0.0 database) went
    # undetected by every check that existed before this job. See
    # tests/install_upgrade_http_test.php for what each check guards.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out sp (full history, for the 6.0.0 upgrade-seed tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PHP 8.1+ because that's this project's real documented minimum
      # (install/install.class.php's own requirements check) - the
      # installer and login's rate-limit handling both depend on PHP
      # 8.1's mysqli_report() behavior change, see install/dbi.class.php
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl, gd, mbstring, xml, dom, simplexml, zip, json, fileinfo
          coverage: none

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root -prootpass --silent && break
            sleep 2
          done

      - name: Extract the 6.0.0 upgrade-seed files
        run: |
          git show 6.0.0:install/data/seopanel.sql > /tmp/old_seopanel.sql
          git show 6.0.0:install/data/textlang.sql > /tmp/old_textlang.sql

      - name: Prepare a fresh-extraction webroot
        run: |
          : > config/sp-config.php
          chmod 666 config/sp-config.php
          chmod 777 tmp

      - name: Start the PHP built-in server
        run: |
          php -S 127.0.0.1:8080 &
          for i in $(seq 1 15); do
            curl -sf -o /dev/null http://127.0.0.1:8080/install/ && break
            sleep 1
          done

      - name: Run the install/upgrade HTTP test
        env:
          SEOPANEL_URL: http://127.0.0.1:8080
          SEOPANEL_WEBROOT: ${{ github.workspace }}
          SEOPANEL_DB_HOST: 127.0.0.1
          SEOPANEL_DB_USER: root
          SEOPANEL_DB_PASS: rootpass
          SEOPANEL_OLD_SEOPANEL_SQL: /tmp/old_seopanel.sql
          SEOPANEL_OLD_TEXTLANG_SQL: /tmp/old_textlang.sql
        run: php tests/install_upgrade_http_test.php

  spTests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: seopanel
          MYSQL_USER: seopanel
          MYSQL_PASSWORD: seopanelpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out sp
        uses: actions/checkout@v4
        with:
          path: sp

      - name: Check out spTests
        uses: actions/checkout@v4
        with:
          repository: seopanel/Seo-Panel-Tests
          path: spTests

      # matches the PHP version actually running in this project's own
      # dev/prod docker image (seopanel/seopanel:6.0.0) - checked via
      # `php -v` there rather than assumed, so this represents real
      # production behavior, not whatever's newest
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli, curl, gd, mbstring, xml, dom, simplexml, zip, json, fileinfo, sodium, openssl
          coverage: none

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root -prootpass --silent && break
            sleep 2
          done

      - name: Seed the database (fresh-install sequence only)
        run: |
          mysql -h 127.0.0.1 -u seopanel -pseopanelpass seopanel < sp/install/data/seopanel.sql
          mysql -h 127.0.0.1 -u seopanel -pseopanelpass seopanel < sp/install/data/textlang.sql

      - name: Write config/sp-config.php
        run: |
          cat > sp/config/sp-config.php <<'EOF'
          <?php
          define('SP_WEBPATH', 'http://localhost/sp');
          define('DB_NAME', 'seopanel');
          define('DB_USER', 'seopanel');
          define('DB_PASSWORD', 'seopanelpass');
          define('DB_HOST', '127.0.0.1');
          define('DB_ENGINE', 'mysql');
          define('SP_INSTALLED', '7.0.0');
          define('SP_DEBUG', 0);
          define('SP_TIMEOUT', 18000);
          EOF

      - name: Run spTests
        working-directory: spTests
        env:
          SEOPANEL_PATH: ${{ github.workspace }}/sp
        run: |
          status=0
          for test_file in tests/php/*_test.php; do
            echo "=== $test_file ==="
            if ! php "$test_file"; then
              status=1
            fi
            echo
          done
          exit $status
